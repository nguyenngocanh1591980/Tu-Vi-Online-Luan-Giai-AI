<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="frontend">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>frontend</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="debug-error-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:white; z-index:999999; padding:20px; box-sizing:border-box; overflow:auto;">
    <h1 style="color:red;">Trình duyệt bắt được lỗi!</h1>
    <p>Hãy chụp ảnh màn hình trang này cho AI nhé:</p>
    <pre id="debug-error-text" style="color:red; font-size:16px; white-space:pre-wrap;"></pre>
  </div>
  <script>
    window.addEventListener('error', function(e) {
      document.getElementById('debug-error-overlay').style.display = 'block';
      document.getElementById('debug-error-text').innerText += e.message + '\n' + (e.filename || '') + ':' + (e.lineno || '') + '\n' + (e.error ? e.error.stack : '') + '\n\n';
    });
    window.addEventListener('unhandledrejection', function(e) {
      document.getElementById('debug-error-overlay').style.display = 'block';
      document.getElementById('debug-error-text').innerText += 'Unhandled Promise Rejection: ' + e.reason + '\n\n';
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
